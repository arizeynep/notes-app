name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest-playwright uvicorn

      # 4. Install Playwright browsers
      - name: Install Playwright browsers
        run: playwright install
    
      # 5. Build and serve frontend
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Build and serve frontend
        run: 
          npm run build
          npx serve -s dist -l 5173 &

      # 6. Start backend server
      - name: Start backend
        run: python -m uvicorn main:app --host 127.0.0.1 --port 8000 &

      # 7. Wait until both servers are up 
      - name: Wait for servers
        run: sleep 5  

      # 8. Run backend tests
      - name: Run backend tests
        run: pytest tests/test_backend.py
          
      # 9. Run frontend tests
      - name: Run frontend tests
        run: pytest tests/test_frontend.py
